<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iframe-test bakfiets lease</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #eceff1; color: #222; }
  .bar { position: sticky; top: 0; z-index: 5; background: #37474f; color: #fff; padding: 12px 16px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .bar b { font-weight: 600; }
  .bar a { color: #fff; }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  .fake { background: #fff; border: 2px dashed #b0bec5; border-radius: 8px; padding: 20px; color: #607d8b; font-size: 14px; margin-bottom: 24px; }
  .frame-box { background: #fff; border-radius: 8px; overflow: hidden; outline: 2px solid #ff9800; margin: 0 auto; }
  .hint { font-size: 13px; color: #607d8b; margin: 8px 0 0; }
  .widths { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; font-size: 13px; color: #607d8b; }
  .widths button { font: inherit; padding: 6px 12px; border: 1px solid #90a4ae; background: #fff; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
  <div class="bar">
    <span><b>Testpagina</b> · het formulier als iframe op een partnersite. Oranje kader = rand van het iframe. Deze balk is "sticky", net als een menubalk.</span>
    <span id="mode"></span>
  </div>
  <div class="page">
    <div class="fake">Hier staat de bestaande inhoud van de partnerpagina (menu, tekst, producten).</div>

    <div class="widths">
      Breedte:
      <button type="button" data-w="100%">Volledig</button>
      <button type="button" data-w="1024px">Laptop (1024)</button>
      <button type="button" data-w="768px">Tablet (768)</button>
      <button type="button" data-w="390px">Telefoon (390)</button>
      <button type="button" data-w="320px">Klein (320)</button>
    </div>

    <div class="frame-box" id="frame-box">
      <!-- ===== Begin embedcode ===== -->
      <iframe data-fietslease-bakfiets data-offset="60" src="index.html" title="Bakfiets lease aanvragen" style="display:block;width:100%;height:85vh;min-height:640px;border:0" loading="lazy"></iframe>
      <!-- Op de echte site staat hier: <script src="https://…/embed.js" async></script>. Op deze testpagina laden we
           het alleen als ?zonder-script niet in de URL staat, zodat je beide situaties kunt zien. -->
      <script>if (location.search.indexOf('zonder-script') < 0) { var s = document.createElement('script'); s.src = 'embed.js'; s.async = true; document.currentScript.after(s); }</script>
      <!-- ===== Einde embedcode ===== -->
    </div>
    <p class="hint" id="hint"></p>

    <div class="fake" style="margin-top:24px">Footer van de partnerpagina.</div>
  </div>
  <script>
    // ?zonder-script laat zien wat er gebeurt als een CMS het script weghaalt
    var plain = location.search.indexOf('zonder-script') > -1;
    document.getElementById('mode').innerHTML = plain
      ? 'Modus: <b>alleen iframe</b> (vaste hoogte, scrollt zelf) · <a href="?">met script</a>'
      : 'Modus: <b>met embed.js</b> (groeit mee) · <a href="?zonder-script">zonder script</a>';
    document.getElementById('hint').textContent = plain
      ? 'Zonder script heeft het iframe een vaste hoogte en scrollt het zelf. De samenvatting en de balk onderin werken dan binnen het frame.'
      : 'Het iframe past zijn hoogte aan de inhoud aan; er is geen tweede scrollbalk.';
    document.querySelectorAll('[data-w]').forEach(function (b) {
      b.onclick = function () { document.getElementById('frame-box').style.maxWidth = b.dataset.w; };
    });
  </script>
</body>
</html>
